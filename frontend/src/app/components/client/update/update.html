-->

<div class="p-6 bg-custom-gradient w-full h-full">
  <div class="card shadow-md rounded-lg bg-gray-50 p-6 max-w-4xl mx-auto">

    <!-- Encabezado -->
    <h2 class="text-3xl font-bold text-gray-800 mb-6 flex items-center gap-3">
      <i class="pi pi-user-edit text-3xl text-gray-700"></i>
      Editar Cliente
    </h2>

    <!-- Formulario -->
    <form [formGroup]="form" (ngSubmit)="submit()" class="w-full">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- Nombre -->
        <div>
          <label class="block mb-2 font-semibold text-gray-700">Nombre</label>
          <input
            pInputText
            type="text"
            formControlName="name"
            class="w-full rounded-md shadow-sm border border-gray-300 
                   focus:ring-2 focus:ring-blue-400 focus:border-blue-400 p-2"
            placeholder="Ingrese el nombre"
          />
          <small class="text-red-600 text-sm" *ngIf="getFieldError('name')">
            {{ getFieldError('name') }}
          </small>
        </div>

        <!-- Email -->
        <div>
          <label class="block mb-2 font-semibold text-gray-700">Email</label>
          <input
            pInputText
            type="email"
            formControlName="email"
            class="w-full rounded-md shadow-sm border border-gray-300 
                   focus:ring-2 focus:ring-blue-400 focus:border-blue-400 p-2"
            placeholder="ejemplo@correo.com"
          />
          <small class="text-red-600 text-sm" *ngIf="getFieldError('email')">
            {{ getFieldError('email') }}
          </small>
        </div>

        <!-- Teléfono -->
        <div>
          <label class="block mb-2 font-semibold text-gray-700">Teléfono</label>
          <input
            pInputText
            type="text"
            formControlName="phone"
            class="w-full rounded-md shadow-sm border border-gray-300 
                   focus:ring-2 focus:ring-blue-400 focus:border-blue-400 p-2"
            placeholder="Ingrese el teléfono"
          />
          <small class="text-red-600 text-sm" *ngIf="getFieldError('phone')">
            {{ getFieldError('phone') }}
          </small>
        </div>

        <!-- Dirección -->
        <div>
          <label class="block mb-2 font-semibold text-gray-700">Dirección</label>
          <input
            pInputText
            type="text"
            formControlName="address"
            class="w-full rounded-md shadow-sm border border-gray-300 
                   focus:ring-2 focus:ring-blue-400 focus:border-blue-400 p-2"
            placeholder="Ingrese la dirección"
          />
          <small class="text-red-600 text-sm" *ngIf="getFieldError('address')">
            {{ getFieldError('address') }}
          </small>
        </div>

        <!-- Contraseña -->
        <div class="md:col-span-2">
          <label class="block mb-2 font-semibold text-gray-700">Contraseña</label>
          <input
            pInputText
            type="password"
            formControlName="password"
            class="w-full rounded-md shadow-sm border border-gray-300 
                   focus:ring-2 focus:ring-blue-400 focus:border-blue-400 p-2"
            placeholder="Ingrese nueva contraseña (opcional)"
          />
        </div>

        <!-- Estado -->
        <div class="md:col-span-2">
          <label class="block mb-2 font-semibold text-gray-700">Estado</label>
          <p-select
            [options]="statuses"
            optionLabel="label"
            optionValue="value"
            formControlName="status"
            placeholder="Seleccione estado"
            class="w-full rounded-md shadow-sm border border-gray-300"
          ></p-select>

          <small class="text-red-600 text-sm" *ngIf="getFieldError('status')">
            {{ getFieldError('status') }}
          </small>
        </div>

      </div>

      <!-- Botones -->
      <div class="flex justify-center mt-6">
        <div class="bg-gray-100 rounded-lg p-4 flex gap-4 items-center shadow-sm">

          <button
            pButton
            type="submit"
            [disabled]="loading"
            class="p-button p-component bg-blue-600 text-white hover:bg-blue-700"
            label="Actualizar"
            icon="pi pi-save"
          ></button>

          <button
            pButton
            type="button"
            class="p-button p-component bg-gray-400 text-white hover:bg-gray-500"
            label="Cancelar"
            icon="pi pi-times"
            (click)="cancelar()"
          ></button>

        </div>
      </div>
    </form>
  </div>
</div>

<p-toast></p-toast>
