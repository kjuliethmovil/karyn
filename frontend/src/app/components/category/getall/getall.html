<!-- 
  Archivo: getall.html
  Autor: Karyn Movil Estacio
  Descripción: Vista moderna para listar categorías con PrimeNG + Tailwind,
  incluyendo búsqueda, tabla estilizada y acciones.
-->

<div class="p-6 bg-custom-gradient w-full h-full">
  <!-- ConfirmDialog necesario -->
  <p-confirmDialog appendTo="body"></p-confirmDialog>

  <!-- Encabezado -->
  <div class="flex justify-between items-center mb-6">

    <h2 class="text-3xl font-bold text-white tracking-wide flex items-center gap-3 text-shadow-custom">
      <i class="pi pi-tags text-white text-3xl text-shadow-custom"></i>
      Gestión de Categorías
    </h2>

    <div class="flex items-center gap-3">
      <!-- Icono de búsqueda -->
      <i class="pi pi-search text-white text-shadow-custom"></i>

      <!-- Barra de búsqueda -->
      <span class="p-input-icon-left w-64">
        <input
          pInputText
          type="text"
          placeholder=" Buscar categoría..."
          (input)="dt.filterGlobal($event.target.value, 'contains')"
          class="p-inputtext-sm w-full rounded-md shadow-sm border border-gray-300
                 focus:outline-none focus:ring-0 focus:border-gray-300
                 text-white text-shadow-custom"
        />
      </span>

      <!-- Botón agregar -->
      <button
        pButton
        type="button"
        class="p-button-sm p-button-rounded p-button-success shadow-md"
        label="Agregar"
        icon="pi pi-plus"
        [routerLink]="['/categorias/nuevo']"
      ></button>
    </div>
  </div>

  <!-- Panel -->
  <div class="card shadow-md rounded-lg bg-gray-50 p-5">
    <h3 class="text-lg font-semibold text-gray-700 mb-4 flex items-center gap-2">
      <i class="pi pi-list text-gray-500"></i>
      Lista de Categorías
    </h3>

    <!-- Tabla -->
    <p-table
      #dt
      [value]="categories"
      stripedRows
      paginator
      [rows]="5"
      [rowsPerPageOptions]="[5,10,20]"
      [globalFilterFields]="['category_id','name','description']"
      class="p-datatable-sm p-datatable-gridlines p-datatable-striped
             rounded-md overflow-hidden bg-white"
      [tableStyle]="{ 'min-width': '60rem' }"
    >
      <!-- Encabezados -->
      <ng-template pTemplate="header">
        <tr class="bg-gray-100 text-gray-700 uppercase text-sm tracking-wide">
          <th pSortableColumn="category_id" class="px-4 py-2 text-left">
            ID <p-sortIcon field="category_id"></p-sortIcon>
          </th>

          <th pSortableColumn="name" class="px-4 py-2 text-left">
            Nombre <p-sortIcon field="name"></p-sortIcon>
          </th>

          <th pSortableColumn="description" class="px-4 py-2 text-left">
            Descripción <p-sortIcon field="description"></p-sortIcon>
          </th>

          <th class="px-4 py-2 text-center">Acciones</th>
        </tr>
      </ng-template>

      <!-- Filas -->
      <ng-template pTemplate="body" let-category>
        <tr class="hover:bg-gray-50 transition">
          <td class="px-4 py-2 font-medium text-gray-800">
            {{ category.id }}
          </td>

          <td class="px-4 py-2">
            {{ category.name }}
          </td>

          <td class="px-4 py-2 truncate">
            {{ category.description }}
          </td>

          <td class="px-4 py-2 text-center">
            <div class="flex justify-center gap-2">
              
              <!-- Editar -->
              <button
                pButton
                type="button"
                icon="pi pi-pencil"
                class="p-button-rounded p-button-text p-button-warning"
                [routerLink]="['/categorias/editar', category.id]"
                pTooltip="Editar"
              ></button>

              <!-- Eliminar -->
              <button
                pButton
                type="button"
                icon="pi pi-trash"
                class="p-button-rounded p-button-text p-button-danger"
                (click)="deleteCategory(category)"
                pTooltip="Eliminar"
              ></button>

            </div>
          </td>
        </tr>
      </ng-template>

    </p-table>
  </div>
</div>
